# Logrotate — US Stock Volume Analyzer (Modul 15.5).
# Rotasi log runtime aplikasi. Pasang di /etc/logrotate.d/stock-analyzer
# dan sesuaikan path. Yii FileTarget juga punya maxLogFiles sendiri (20);
# logrotate mengelola file fisik agar disk tidak penuh.

/var/www/html/runtime/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}