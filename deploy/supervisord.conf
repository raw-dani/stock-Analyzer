#/etc/supervisor/conf.d/supervisord.conf — Modul 15.4
# Menjalankan PHP-FPM, cron, dan (opsional) worker antrian Redis di satu container.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

# PHP-FPM
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Cron (jadwal diedit di deploy/crontab.example)
[program:cron]
command=crond -f -L /dev/stdout
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Queue worker Redis — Modul 15.3 (hanya jika QUEUE_DRIVER=redis)
# Aktifkan dengan menghapus tanda komentar & set autostart=true bila Redis dipakai.
[program:queue-worker]
command=php /var/www/html/yii queue/listen --verbose
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0