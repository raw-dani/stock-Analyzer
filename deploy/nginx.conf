# nginx.conf — US Stock Volume Analyzer (Modul 15.4)
# Dipasang di service nginx pada docker-compose (container nginx).

server {
    listen 80;
    server_name _;
    root /var/www/html/web;
    index index.php;

    # Aset statis (cached)
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    # Semua permintaan non-statika → Yii front controller.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP-FPM (service app)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300;
    }

    # Proteksi file sensitif
    location ~ /(\.|runtime|config|data) {
        deny all;
    }
}